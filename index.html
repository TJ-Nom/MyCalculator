<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>万能電卓</title>
  
  <link rel="manifest" id="manifest-placeholder">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .stealth-btn {
      transition: background-color 0.1s, transform 0.05s;
    }
    .stealth-btn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }
    details summary::-webkit-details-marker {
      display: none;
    }
    .recording-dot {
      transition: background-color 0.2s;
    }
    .recording-dot.active {
      background-color: #ef4444 !important;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full">

  <!-- ========================================== -->
  <!-- 1. ステルス電卓画面 -->
  <!-- ========================================== -->
  <div id="calculator-view" class="relative flex-1 flex flex-col justify-between max-w-md mx-auto w-full p-4 h-full overflow-hidden">
    
    <!-- 電卓ヘッダー -->
    <div class="flex items-center justify-between py-2 border-b border-gray-800 text-gray-400 shrink-0">
      <div class="flex items-center space-x-2">
        <button id="calc-menu-btn" class="p-1 hover:text-white" title="メニュー">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <!-- タイトル長押しで確認ダイアログを表示してステルス解除 -->
        <span id="stealth-title" class="font-semibold text-gray-200 select-none cursor-pointer tracking-wider px-2 py-1 rounded active:bg-gray-800">万能電卓</span>
      </div>
      <div class="flex items-center space-x-2">
        <!-- BackSpaceボタン（ヘッダー右側） -->
        <button id="calc-backspace-btn" class="p-1.5 hover:text-white text-gray-400 active:text-emerald-400" title="1文字削除">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H20a2 2 0 012 2v10a2 2 0 01-2 2h-9.172a2 2 0 01-1.414-.586L3 12z"></path></svg>
        </button>
        <!-- 計算履歴ボタン -->
        <button id="calc-history-toggle" class="p-1 hover:text-white" title="計算履歴">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
      </div>
    </div>

    <!-- サイドメニュー -->
    <div id="side-menu-overlay" class="hidden absolute inset-0 bg-black/60 z-40 transition-opacity"></div>
    <div id="side-menu" class="absolute top-0 left-0 bottom-0 w-64 bg-gray-900 border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-200 flex flex-col justify-between p-4 shadow-2xl">
      <div class="space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-gray-800 text-gray-200">
          <span class="font-bold text-sm">万能電卓 メニュー</span>
          <button id="btn-close-side-menu" class="p-1 text-gray-400 hover:text-white">✕</button>
        </div>
        <div class="space-y-1 text-sm text-gray-300">
          <button class="w-full text-left px-3 py-2.5 rounded-lg bg-gray-800 text-emerald-400 font-medium">標準電卓</button>
          <button id="menu-item-history" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-800 text-gray-300">計算履歴</button>
        </div>
      </div>
      <div class="pt-3 border-t border-gray-800">
        <button id="menu-item-recorder" class="w-full text-left px-3 py-2 text-xs text-gray-500 hover:text-gray-300 flex items-center space-x-2">
          <span>● 管理画面を開く</span>
        </button>
      </div>
    </div>

    <!-- 計算履歴ドロワー -->
    <div id="calc-history-panel" class="hidden bg-gray-900 border border-gray-800 rounded-lg p-3 my-2 max-h-36 overflow-y-auto text-sm shrink-0">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-gray-800 text-xs text-gray-400">
        <span>計算履歴</span>
        <button id="clear-calc-history" class="text-red-400 hover:underline">消去</button>
      </div>
      <div id="calc-history-list" class="space-y-1 text-right text-gray-300 font-mono">
        <div class="text-gray-500 text-center py-2">履歴はありません</div>
      </div>
    </div>

    <!-- 電卓ディスプレイ（3桁区切りフォーマット表示） -->
    <div class="flex-1 flex flex-col justify-end py-2 px-2 text-right shrink min-h-0">
      <div id="calc-sub-display" class="text-gray-400 text-sm h-5 overflow-hidden font-mono tracking-wide"></div>
      <div class="flex items-baseline justify-end space-x-1">
        <span id="calc-main-display" class="text-5xl font-light tracking-tight font-mono text-white break-all">0</span>
        <span id="stealth-rec-indicator" class="recording-dot w-2 h-2 rounded-full bg-transparent mb-1 shrink-0"></span>
      </div>
    </div>

    <!-- 電卓キーパッド -->
    <div class="grid grid-cols-4 gap-2 pb-2 pt-1 shrink-0">
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcAction('clear')">C</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcAction('paren')">()</button>
      <button id="btn-percent" class="stealth-btn bg-amber-600 active:bg-amber-500 text-white text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="handlePercentTap()">%</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcInput('/')">÷</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('7')">7</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('8')">8</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('9')">9</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('*')">×</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('4')">4</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('5')">5</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('6')">6</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('-')">-</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('1')">1</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('2')">2</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('3')">3</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('+')">+</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('0')">0</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('00')">00</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('.')">.</button>
      <button class="stealth-btn bg-emerald-500 active:bg-emerald-400 text-white text-xl sm:text-2xl font-medium py-3 rounded-2xl" onclick="calcAction('equals')">=</button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. ボイスレコーダー＆文字起こし管理画面 -->
  <!-- ========================================== -->
  <div id="recorder-view" class="hidden flex-1 max-w-lg mx-auto w-full p-4 flex-col space-y-4 overflow-y-auto h-full">
    
    <!-- 管理ヘッダー -->
    <div class="flex items-center justify-between pb-3 border-b border-gray-800 shrink-0">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </div>
        <div>
          <h1 class="text-base font-semibold leading-tight">スマートボイスレコーダー</h1>
          <p class="text-xs text-gray-400">端末内暗号化保存 / Gemini 要約・文字起こし</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-return-calc" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-800 border border-gray-700" title="電卓画面へ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        </button>
        <button id="btn-open-settings" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-800 border border-gray-700" title="設定">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
      </div>
    </div>

    <!-- 設定パネル -->
    <div id="settings-panel" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-sm shrink-0">
      <div class="flex justify-between items-center pb-2 border-b border-gray-800">
        <span class="font-semibold text-gray-200">各種設定</span>
        <button id="btn-close-settings" class="text-gray-400 hover:text-white text-xs">閉じる</button>
      </div>
      
      <!-- APIキー設定 -->
      <div class="space-y-2">
        <label class="block text-xs font-medium text-gray-300">Gemini APIキー</label>
        <div class="flex space-x-2">
          <input type="password" id="input-api-key" placeholder="AIzaSy..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          <button id="btn-save-api-key" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">保存</button>
        </div>
      </div>

      <!-- モデル選択 -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300">Gemini モデル</label>
        <select id="select-model" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
          <option value="gemini-2.5-flash">gemini-2.5-flash (推奨・高速)</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash (安定)</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro (高精度)</option>
        </select>
      </div>

      <!-- 暗号化バックアップ & 復元 -->
      <div class="pt-2 border-t border-gray-800 space-y-2">
        <label class="block text-xs font-medium text-gray-300">暗号化バックアップ & 復元 (AES-256)</label>
        <div class="space-y-2">
          <input type="password" id="input-backup-pass" placeholder="バックアップ暗号化パスワード" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
          <div class="flex space-x-2">
            <button id="btn-export-backup" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 py-2 rounded-lg text-xs">暗号化保存 (.enc)</button>
            <label class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 py-2 rounded-lg text-xs text-center cursor-pointer">
              復元読込
              <input type="file" id="input-restore-file" accept=".enc" class="hidden">
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 録音コントロール -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col items-center space-y-3 shrink-0">
      <div class="w-full bg-gray-950 rounded-xl h-14 flex items-center justify-center px-4 overflow-hidden border border-gray-800">
        <canvas id="waveform-canvas" class="w-full h-10"></canvas>
      </div>
      <div class="flex items-center space-x-4">
        <button id="btn-main-record" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 active:scale-95 flex items-center justify-center shadow-lg transition-transform">
          <div id="rec-btn-icon" class="w-6 h-6 rounded-sm bg-white"></div>
        </button>
      </div>
      <div id="record-status-label" class="text-xs text-gray-400 font-mono">待機中 (電卓で「%」を素早く2回タップでも起動)</div>
    </div>

    <!-- 録音・要約リスト一覧 -->
    <div class="space-y-3 flex-1">
      <div class="flex justify-between items-center text-xs text-gray-400 px-1">
        <span>録音・要約一覧 (端末内IndexedDB)</span>
        <span id="recordings-count">0 件</span>
      </div>
      <div id="recordings-list" class="space-y-3 pb-6"></div>
    </div>

  </div>


  <!-- ========================================== -->
  <!-- 3. JavaScript ロジック -->
  <!-- ========================================== -->
  <script>
    let db = null;
    let audioStream = null;
    let audioContext = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let percentTapTimer = null;
    let analyserNode = null;
    let animFrameId = null;

    let calcState = {
      display: '0',
      subDisplay: '',
      history: []
    };

    // PWA Manifest
    (function setupPwa() {
      const manifest = {
        name: "万能電卓",
        short_name: "万能電卓",
        start_url: window.location.href.split('?')[0],
        display: "standalone",
        orientation: "portrait",
        background_color: "#121212",
        theme_color: "#121212",
        icons: [{
          src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'%3E%3Crect x='4' y='2' width='16' height='20' rx='2'/%3E%3Cline x1='8' y1='6' x2='16' y2='6' stroke='white' stroke-width='2'/%3E%3C/svg%3E",
          sizes: "192x192",
          type: "image/svg+xml"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(blob);
      const manifestLink = document.getElementById('manifest-placeholder');
      if (manifestLink) manifestLink.setAttribute('href', manifestUrl);
    })();

    // サイドメニュー開閉
    const menuBtn = document.getElementById('calc-menu-btn');
    const sideMenu = document.getElementById('side-menu');
    const sideMenuOverlay = document.getElementById('side-menu-overlay');
    const closeSideMenuBtn = document.getElementById('btn-close-side-menu');

    function openSideMenu() {
      sideMenuOverlay.classList.remove('hidden');
      sideMenu.classList.remove('-translate-x-full');
    }

    function closeSideMenu() {
      sideMenuOverlay.classList.add('hidden');
      sideMenu.classList.add('-translate-x-full');
    }

    if (menuBtn) menuBtn.addEventListener('click', openSideMenu);
    if (closeSideMenuBtn) closeSideMenuBtn.addEventListener('click', closeSideMenu);
    if (sideMenuOverlay) sideMenuOverlay.addEventListener('click', closeSideMenu);

    document.getElementById('menu-item-history').addEventListener('click', () => {
      closeSideMenu();
      document.getElementById('calc-history-panel').classList.remove('hidden');
    });

    document.getElementById('menu-item-recorder').addEventListener('click', () => {
      closeSideMenu();
      if (confirm("ボイスレコーダーの管理画面を開きますか？")) {
        showView('recorder');
      }
    });

    // BackSpaceボタン
    document.getElementById('calc-backspace-btn').addEventListener('click', () => {
      calcAction('backspace');
    });

    // IndexedDB の初期化
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('StealthVoiceCalcDB', 1);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains('recordings')) {
            dbInstance.createObjectStore('recordings', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          loadSavedRecordings();
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    // 数値を3桁カンマ区切りにフォーマット（演算子や括弧、小数点を維持）
    function formatCalculationExpression(expr) {
      if (!expr) return '0';
      // 数値ブロック（整数部・小数部）ごとにカンマを付与
      return expr.replace(/(\d+)(\.\d*)?/g, (match, integerPart, decimalPart) => {
        const formattedInt = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return formattedInt + (decimalPart || '');
      });
    }

    // 電卓表示更新
    function updateCalcDisplay() {
      document.getElementById('calc-main-display').textContent = formatCalculationExpression(calcState.display);
      document.getElementById('calc-sub-display').textContent = formatCalculationExpression(calcState.subDisplay);
    }

    function calcInput(char) {
      if (calcState.display === '0' && char !== '.') {
        calcState.display = char;
      } else {
        calcState.display += char;
      }
      updateCalcDisplay();
    }

    function calcAction(action) {
      if (action === 'clear') {
        calcState.display = '0';
        calcState.subDisplay = '';
      } else if (action === 'backspace') {
        if (calcState.display.length > 1) {
          calcState.display = calcState.display.slice(0, -1);
        } else {
          calcState.display = '0';
        }
      } else if (action === 'paren') {
        const openCount = (calcState.display.match(/\(/g) || []).length;
        const closeCount = (calcState.display.match(/\)/g) || []).length;
        if (openCount > closeCount) {
          calcInput(')');
        } else {
          calcInput('(');
        }
      } else if (action === 'equals') {
        try {
          const expr = calcState.display.replace(/×/g, '*').replace(/÷/g, '/');
          const res = Function(`'use strict'; return (${expr})`)();
          calcState.history.unshift(`${formatCalculationExpression(calcState.display)} = ${formatCalculationExpression(String(res))}`);
          if (calcState.history.length > 20) calcState.history.pop();
          calcState.subDisplay = `${calcState.display} =`;
          calcState.display = String(res);
          renderCalcHistory();
        } catch (e) {
          calcState.subDisplay = 'Error';
        }
      }
      updateCalcDisplay();
    }

    function handlePercentTap() {
      if (percentTapTimer) {
        clearTimeout(percentTapTimer);
        percentTapTimer = null;
        toggleStealthRecording();
      } else {
        percentTapTimer = setTimeout(() => {
          try {
            const val = parseFloat(calcState.display);
            if (!isNaN(val)) {
              calcState.display = String(val / 100);
              updateCalcDisplay();
            }
          } catch (e) {}
          percentTapTimer = null;
        }, 450);
      }
    }

    function renderCalcHistory() {
      const list = document.getElementById('calc-history-list');
      if (calcState.history.length === 0) {
        list.innerHTML = '<div class="text-gray-500 text-center py-2">履歴はありません</div>';
        return;
      }
      list.innerHTML = calcState.history.map(item => `<div>${escapeHtml(item)}</div>`).join('');
    }

    // ステルス切り替え（長押しで確認ダイアログを出してから遷移）
    let pressTimer = null;
    const titleEl = document.getElementById('stealth-title');

    function triggerSecretTransition() {
      if (confirm("ボイスレコーダーの管理画面を開きますか？")) {
        showView('recorder');
      }
    }

    titleEl.addEventListener('touchstart', (e) => {

    // 録音 & 音声処理
    async function toggleStealthRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(audioStream);
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;
        source.connect(analyserNode);

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = handleRecordingComplete;

        mediaRecorder.start(1000); // 1秒ごとにチャンク収集
        isRecording = true;

        document.getElementById('stealth-rec-indicator').classList.add('active');
        document.getElementById('rec-btn-icon').className = "w-6 h-6 rounded-full bg-red-600 animate-pulse";
        document.getElementById('record-status-label').textContent = "● 録音中...";
        drawWaveform();
      } catch (err) {
        alert("マイクの利用許可が必要です: " + err.message);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(t => t.stop());
      }
      if (animFrameId) cancelAnimationFrame(animFrameId);
      isRecording = false;

      document.getElementById('stealth-rec-indicator').classList.remove('active');
      document.getElementById('rec-btn-icon').className = "w-6 h-6 rounded-sm bg-white";
      document.getElementById('record-status-label').textContent = "音声を保存・処理中...";
    }

    document.getElementById('btn-main-record').addEventListener('click', () => {
      toggleStealthRecording();
    });

    function drawWaveform() {
      if (!isRecording || !analyserNode) return;
      const canvas = document.getElementById('waveform-canvas');
      const ctx = canvas.getContext('2d');
      const data = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(data);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#10b981';
      const barWidth = (canvas.width / data.length) * 1.5;
      let x = 0;
      for (let i = 0; i < data.length; i++) {
        const barHeight = (data[i] / 255) * canvas.height;
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }
      animFrameId = requestAnimationFrame(drawWaveform);
    }

    // 録音完了時のフェイルセーフ保存（長時間録音クラッシュ防止）
    async function handleRecordingComplete() {
      const rawBlob = new Blob(recordedChunks, { type: 'audio/webm' });
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const timestampStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      const title = `録音_${timestampStr}`;

      // 【安全策】まずWebMの生データを即座にIndexedDBへ登録（クラッシュしても録音が消えない）
      const recordItem = {
        title: title,
        date: `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
        audioBlob: rawBlob,
        mimeType: 'audio/webm',
        sizeKb: Math.max(1, Math.round(rawBlob.size / 1024)),
        durationSec: 0,
        summary: null,
        transcription: null,
        status: 'pending'
      };

      let id = null;
      try {
        id = await saveRecordToDB(recordItem);
        recordItem.id = id;
        renderRecordCard(recordItem, true);
      } catch (dbErr) {
        console.error("IndexedDB Save Failed:", dbErr);
      }

      // MP3化と無音カットの試行（長時間録音でメモリ不足等になった場合は元のWebMのまま保持）
      try {
        const arrayBuffer = await rawBlob.arrayBuffer();
        const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await tempCtx.decodeAudioData(arrayBuffer);
        recordItem.durationSec = Math.round(decodedBuffer.duration);

        // 10分未満の録音のみ無音カットを実行（長時間はメモリ枯渇を避けるためスキップ）
        let targetBuffer = decodedBuffer;
        if (decodedBuffer.duration < 600) {
          targetBuffer = trimSilence(decodedBuffer, 0.02);
        }

        const mp3Blob = encodeToMp3(targetBuffer);
        recordItem.audioBlob = mp3Blob;
        recordItem.mimeType = 'audio/mp3';
        recordItem.sizeKb = Math.max(1, Math.round(mp3Blob.size / 1024));

        if (id) await updateRecordInDB(recordItem);
        applyAudioUpdateToCard(recordItem);
      } catch (audioErr) {
        console.warn("MP3 conversion failed, keeping original WebM audio:", audioErr);
        // MP3化に失敗してもWebMで再生・保存可能
      }

      document.getElementById('record-status-label').textContent = "待機中 (電卓で「%」を素早いダブルタップ)";
      
      // オフライン判定：ネットに繋がっていない場合は要約を保留にする
      if (!navigator.onLine) {
        updateCardSummaryStatus(recordItem.id, "オフラインのため要約は保留されました（Wi-Fi復帰後に再試行ボタンを押してください）", true, recordItem);
        return;
      }

      // Gemini要約へ
      requestGeminiSummary(recordItem);
    }

    function trimSilence(buffer, threshold = 0.02) {
      const channelData = buffer.getChannelData(0);
      let start = 0;
      let end = channelData.length - 1;

      while (start < channelData.length && Math.abs(channelData[start]) < threshold) start++;
      while (end > start && Math.abs(channelData[end]) < threshold) end--;

      if (start >= end) return buffer;

      const trimmedLength = Math.max(1, end - start);
      const newCtx = new (window.AudioContext || window.webkitAudioContext)();
      const newBuffer = newCtx.createBuffer(buffer.numberOfChannels, trimmedLength, buffer.sampleRate);

      for (let c = 0; c < buffer.numberOfChannels; c++) {
        newBuffer.copyToChannel(buffer.getChannelData(c).subarray(start, end), c);
      }
      return newBuffer;
    }

    function encodeToMp3(audioBuffer) {
      const channels = 1;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
      const samples = audioBuffer.getChannelData(0);
      const sampleBlockSize = 1152;
      const mp3Data = [];

      const int16Samples = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
        const chunk = int16Samples.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(chunk);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }
      const endBuf = mp3encoder.flush();
      if (endBuf.length > 0) mp3Data.push(endBuf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    // Gemini API 要約 & 文字起こし
    async function requestGeminiSummary(item) {
      const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
      let model = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';

      if (!apiKey) {
        updateCardSummaryStatus(item.id, "APIキーが未登録です。設定画面からGemini APIキーを入力してください。", true, item);
        return;
      }

      if (!navigator.onLine) {
        updateCardSummaryStatus(item.id, "インターネットに接続されていません（Wi-Fi/モバイル通信復帰後に再試行可能）", true, item);
        return;
      }

      updateCardSummaryStatus(item.id, `Gemini (${model}) へ音声送信中...`, false);

      try {
        const base64Audio = await blobToBase64(item.audioBlob);
        if (!base64Audio) throw new Error("音声データの変換に失敗しました。");

        const promptText = `あなたはプロの議事録アシスタントです。
提供された音声を忠実に日本語で文字起こしし、要約してください。
必ず以下のJSON形式のみを出力してください（Markdown記法やコードブロックは不要です）:
{
  "summary": "録音内容の全体要約（主要な決定事項や論点を整理）",
  "transcription": "音声の文字起こし全文"
}`;

        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: promptText },
              {
                inline_data: {
                  mime_type: item.mimeType || "audio/mp3",
                  data: base64Audio
                }
              }
            ]
          }],
          generationConfig: { temperature: 0.2 }
        };

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errDetail = "";
          try {
            const errJson = await response.json();
            errDetail = errJson.error?.message || JSON.stringify(errJson);
          } catch(e) {
            errDetail = await response.text();
          }
          throw new Error(`HTTP ${response.status}: ${errDetail}`);
        }

        const data = await response.json();
        const candidate = data.candidates?.[0];
        if (!candidate || !candidate.content) {
          throw new Error("Geminiから有効な応答が得られませんでした。");
        }

        const rawText = candidate.content.parts?.[0]?.text || '';
        let parsed = null;
        try {
          const cleanedText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();
          parsed = JSON.parse(cleanedText);
        } catch (e) {
          parsed = { summary: rawText.slice(0, 200), transcription: rawText };
        }

        item.summary = parsed.summary || "要約が取得できませんでした";
        item.transcription = parsed.transcription || "文字起こしが取得できませんでした";
        item.status = 'completed';
        await updateRecordInDB(item);

        applySummaryToCard(item);
      } catch (err) {
        console.error("Gemini API Error:", err);
        updateCardSummaryStatus(item.id, `エラー: ${err.message}`, true, item);
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          if (typeof reader.result === 'string') {
            const base64 = reader.result.split(',')[1];
            resolve(base64 || '');
          } else {
            reject(new Error("FileReader result is not string"));
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // IndexedDB 操作
    function saveRecordToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.add(item);
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    function updateRecordInDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.put(item);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function deleteRecordFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);

    function copyFullTranscription(e, id) {
      e.stopPropagation();
      const el = document.getElementById(`transcription-text-${id}`);
      if (!el) return;
      const text = el.innerText || el.textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("文字起こし全文をコピーしました！");
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert("文字起こし全文をコピーしました！");

    // 暗号化バックアップ & 復元
    document.getElementById('btn-export-backup').addEventListener('click', async () => {
      const password = document.getElementById('input-backup-pass').value;
      if (!password) {
        alert("暗号化パスワードを入力してください。");
        return;
      }

      const tx = db.transaction('recordings', 'readonly');
      const store = tx.objectStore('recordings');
      const req = store.getAll();

      req.onsuccess = async (e) => {
        const records = e.target.result || [];
        const exportList = [];

        for (const item of records) {
          const b64 = await blobToBase64(item.audioBlob);
          exportList.push({
            title: item.title,
            date: item.date,
            sizeKb: item.sizeKb,
            durationSec: item.durationSec,
            summary: item.summary,
            transcription: item.transcription,
            status: item.status,
            audioBase64: b64,
            mimeType: item.mimeType || 'audio/mp3'
          });
        }

        const rawJson = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), records: exportList });
        const encData = await encryptData(rawJson, password);

        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const filename = `MyCalculator_Backup_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.enc`;

        const blob = new Blob([encData], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };
    });

    document.getElementById('input-restore-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const password = document.getElementById('input-backup-pass').value;
      if (!password) {
        alert("復元用パスワードを入力してください。");
        e.target.value = '';
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const decJson = await decryptData(new Uint8Array(buffer), password);
        const data = JSON.parse(decJson);

        if (!data.records || !Array.isArray(data.records)) throw new Error("形式が正しくありません");

        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');

        for (const r of data.records) {
          const byteCharacters = atob(r.audioBase64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
          const byteArray = new Uint8Array(byteNumbers);
          const mime = r.mimeType || 'audio/mp3';
          const audioBlob = new Blob([byteArray], { type: mime });

          store.add({
            title: r.title,
            date: r.date,
            sizeKb: r.sizeKb,
            durationSec: r.durationSec,
            summary: r.summary,
            transcription: r.transcription,
            status: r.status,
            audioBlob: audioBlob,
            mimeType: mime
          });
        }

        alert("バックアップから復元しました！");
        e.target.value = '';
        loadSavedRecordings();
      } catch (err) {
        alert("復元に失敗しました。パスワードが誤っているかファイルが破損しています: " + err.message);
      }
    });

    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
    }

    async function deriveKey(keyMaterial, salt) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(text));

      const res = new Uint8Array(salt.length + iv.length + cipher.byteLength);
      res.set(salt, 0);
      res.set(iv, salt.length);
      res.set(new Uint8Array(cipher), salt.length + iv.length);
      return res;
    }

    async function decryptData(bytes, password) {
      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const cipher = bytes.slice(28);
      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);
      const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher);
      return new TextDecoder().decode(dec);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 初期化実行
    (async function init() {
      await initDB();
      updateCalcDisplay();
    })();
  </script>
