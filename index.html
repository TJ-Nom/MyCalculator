<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>万能電卓</title>
  
  <link rel="manifest" id="manifest-placeholder">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .stealth-btn {
      transition: background-color 0.1s, transform 0.05s;
    }
    .stealth-btn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }
    details summary::-webkit-details-marker {
      display: none;
    }
    .recording-dot {
      transition: background-color 0.2s;
    }
    .recording-dot.active {
      background-color: #ef4444 !important;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
    }
    /* 有機EL焼き付き防止＆静的コンテンツ判定回避用の微細アニメーション（肉眼ではほぼ判別不能） */
    @keyframes antiBurnInShift {
      0%   { transform: translate(0px, 0px); opacity: 0.995; }
      25%  { transform: translate(0.6px, 0px); opacity: 1; }
      50%  { transform: translate(0.6px, 0.6px); opacity: 0.995; }
      75%  { transform: translate(0px, 0.6px); opacity: 1; }
      100% { transform: translate(0px, 0px); opacity: 0.995; }
    }
    .anti-static-active {
      animation: antiBurnInShift 8s infinite linear;
    }
    /* 自然な電卓数字フォント & カンマの幅詰め */
    .calc-number-display {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-feature-settings: "tnum" 1;
      letter-spacing: -0.02em;
    }
  </style>
</head>
<body class="flex flex-col justify-between h-full w-full">

  <!-- 疑似電源オフ（完全黒画面ロック・有機EL完全消灯）オーバーレイ -->
  <!-- Fullscreen APIを使わず固定レイヤーで覆うため、ブラウザの警告メッセージ等は一切出ません -->
  <div id="blackout-curtain" class="hidden fixed inset-0 bg-black z-[100] cursor-pointer select-none" style="background-color: #000000;"></div>

  <!-- 汎用トースト通知（管理画面を開いている時のみ表示） -->
  <div id="toast-container" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 space-y-2 pointer-events-none w-11/12 max-w-sm"></div>

  <!-- 汎用確認モーダル (confirm代替) -->
  <div id="custom-modal-overlay" class="hidden fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-xs w-full p-5 space-y-4 shadow-2xl">
      <h3 id="modal-title" class="text-sm font-semibold text-gray-100">確認</h3>
      <p id="modal-message" class="text-xs text-gray-300 leading-relaxed"></p>
      <div class="flex justify-end space-x-2 pt-2">
        <button id="modal-cancel-btn" class="px-4 py-2 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 text-xs font-medium">キャンセル</button>
        <button id="modal-ok-btn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-500 text-xs font-medium">OK</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 1. ステルス電卓画面 -->
  <!-- ========================================== -->
  <div id="calculator-view" class="relative flex-1 flex flex-col justify-between max-w-md mx-auto w-full p-4 h-full overflow-hidden">
    
    <!-- 電卓ヘッダー -->
    <div class="flex items-center justify-between py-2 border-b border-gray-800 text-gray-400 shrink-0">
      <div class="flex items-center space-x-2">
        <button id="calc-menu-btn" class="p-1 hover:text-white" title="メニュー">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <!-- タイトル長押しで確認ダイアログ表示 -->
        <span id="stealth-title" class="font-semibold text-gray-200 select-none cursor-pointer tracking-wider px-2 py-1 rounded active:bg-gray-800">万能電卓</span>
      </div>
      <div class="flex items-center space-x-2">
        <!-- BackSpaceボタン -->
        <button id="calc-backspace-btn" class="p-1.5 hover:text-white text-gray-400 active:text-emerald-400" title="1文字削除">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H20a2 2 0 012 2v10a2 2 0 01-2 2h-9.172a2 2 0 01-1.414-.586L3 12z"></path></svg>
        </button>
        <!-- 計算履歴ボタン -->
        <button id="calc-history-toggle" class="p-1 hover:text-white" title="計算履歴">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
      </div>
    </div>

    <!-- サイドメニュー -->
    <div id="side-menu-overlay" class="hidden absolute inset-0 bg-black/60 z-40 transition-opacity"></div>
    <div id="side-menu" class="absolute top-0 left-0 bottom-0 w-64 bg-gray-900 border-r border-gray-800 z-50 transform -translate-x-full transition-transform duration-200 flex flex-col justify-between p-4 shadow-2xl">
      <div class="space-y-4">
        <div class="flex items-center justify-between pb-3 border-b border-gray-800 text-gray-200">
          <span class="font-bold text-sm">万能電卓 メニュー</span>
          <button id="btn-close-side-menu" class="p-1 text-gray-400 hover:text-white">✕</button>
        </div>
        <div class="space-y-1 text-sm text-gray-300">
          <button class="w-full text-left px-3 py-2.5 rounded-lg bg-gray-800 text-emerald-400 font-medium">標準電卓</button>
          <button id="menu-item-history" class="w-full text-left px-3 py-2.5 rounded-lg hover:bg-gray-800 text-gray-300">計算履歴</button>
        </div>
      </div>
      <div class="pt-3 border-t border-gray-800">
        <button id="menu-item-recorder" class="w-full text-left px-3 py-2 text-xs text-gray-500 hover:text-gray-300 flex items-center space-x-2">
          <span>● 管理画面を開く</span>
        </button>
      </div>
    </div>

    <!-- 計算履歴ドロワー -->
    <div id="calc-history-panel" class="hidden bg-gray-900 border border-gray-800 rounded-lg p-3 my-2 max-h-36 overflow-y-auto text-sm shrink-0">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-gray-800 text-xs text-gray-400">
        <span>計算履歴</span>
        <button id="clear-calc-history" class="text-red-400 hover:underline">消去</button>
      </div>
      <div id="calc-history-list" class="space-y-1 text-right text-gray-300 font-mono">
        <div class="text-gray-500 text-center py-2">履歴はありません</div>
      </div>
    </div>

    <!-- 電卓ディスプレイ -->
    <div id="calc-display-area" class="flex-1 flex flex-col justify-end py-2 px-2 text-right shrink min-h-0 cursor-pointer">
      <div id="calc-sub-display" class="calc-number-display text-gray-400 text-sm h-5 overflow-hidden tracking-wide"></div>
      <div class="flex items-baseline justify-end space-x-1">
        <span id="calc-main-display" class="calc-number-display text-5xl font-light text-white break-all">0</span>
        <span id="stealth-rec-indicator" class="recording-dot w-2 h-2 rounded-full bg-transparent mb-1 shrink-0"></span>
      </div>
    </div>

    <!-- 電卓キーパッド -->
    <div class="grid grid-cols-4 gap-2 pb-2 pt-1 shrink-0">
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcAction('clear')">C</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcAction('paren')">()</button>
      <button id="btn-percent" class="stealth-btn bg-amber-600 active:bg-amber-500 text-white text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="handlePercentTap()">%</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-lg sm:text-xl font-medium py-3 rounded-2xl" onclick="calcInput('/')">÷</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('7')">7</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('8')">8</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('9')">9</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('*')">×</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('4')">4</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('5')">5</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('6')">6</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('-')">-</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('1')">1</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('2')">2</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('3')">3</button>
      <button class="stealth-btn bg-gray-800 text-emerald-400 text-xl font-medium py-3 rounded-2xl" onclick="calcInput('+')">+</button>

      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('0')">0</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('00')">00</button>
      <button class="stealth-btn bg-gray-900 text-white text-xl sm:text-2xl font-light py-3 rounded-2xl" onclick="calcInput('.')">.</button>
      <button class="stealth-btn bg-emerald-500 active:bg-emerald-400 text-white text-xl sm:text-2xl font-medium py-3 rounded-2xl" onclick="calcAction('equals')">=</button>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. ボイスレコーダー＆文字起こし管理画面 -->
  <!-- ========================================== -->
  <div id="recorder-view" class="hidden flex-1 max-w-lg mx-auto w-full p-4 flex-col space-y-4 overflow-y-auto h-full">
    
    <!-- 管理ヘッダー -->
    <div class="flex items-center justify-between pb-3 border-b border-gray-800 shrink-0">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <h1 class="text-base font-semibold leading-tight">スマートボイスレコーダー</h1>
            <span id="network-status-badge" class="text-[10px] px-2 py-0.5 rounded-full font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">オンライン</span>
            <span id="wakelock-status-badge" class="hidden text-[10px] px-2 py-0.5 rounded-full font-medium bg-indigo-950 text-indigo-300 border border-indigo-800">スリープ防止稼働中</span>
          </div>
          <p class="text-xs text-gray-400">スリープ遮断防止 / 無音カット修復 / 自動＆手動要約</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-return-calc" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-800 border border-gray-700" title="電卓画面へ">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
        </button>
        <button id="btn-open-settings" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-800 border border-gray-700" title="設定">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
      </div>
    </div>

    <!-- 設定パネル -->
    <div id="settings-panel" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-4 text-sm shrink-0">
      <div class="flex justify-between items-center pb-2 border-b border-gray-800">
        <span class="font-semibold text-gray-200">各種設定</span>
        <button id="btn-close-settings" class="text-gray-400 hover:text-white text-xs">閉じる</button>
      </div>
      
      <!-- APIキー設定 -->
      <div class="space-y-2">
        <label class="block text-xs font-medium text-gray-300">Gemini APIキー</label>
        <div class="flex space-x-2">
          <input type="password" id="input-api-key" placeholder="AIzaSy..." class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
          <button id="btn-save-api-key" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-lg text-xs font-medium">保存</button>
        </div>
      </div>

      <!-- モデル選択 -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300">Gemini モデル</label>
        <select id="select-model" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
          <option value="gemini-2.5-flash">gemini-2.5-flash (推奨・長時間対応・高速)</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash (安定)</option>
          <option value="gemini-1.5-pro">gemini-1.5-pro (高精度)</option>
        </select>
      </div>

      <!-- 自動実行設定 -->
      <div class="flex items-center justify-between pt-2 border-t border-gray-800">
        <div>
          <span class="block text-xs font-medium text-gray-300">Wi-Fi/通信復帰時に未処理データを自動処理</span>
          <span class="block text-[10px] text-gray-500">オンラインになった際、未完了の録音を自動で文字起こし・要約します</span>
        </div>
        <input type="checkbox" id="toggle-auto-sync" checked class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
      </div>

      <!-- 録音開始後の自動消灯（疑似電源オフ）設定 -->
      <div class="flex items-center justify-between pt-2 border-t border-gray-800">
        <div>
          <span class="block text-xs font-medium text-gray-300">録音開始3秒後に自動で画面を真っ黒にする</span>
          <span class="block text-[10px] text-gray-500">電卓で「%」2回タップ後、自動で疑似電源オフに移行します</span>
        </div>
        <input type="checkbox" id="toggle-auto-blackout" checked class="w-4 h-4 accent-indigo-600 rounded cursor-pointer">
      </div>

      <!-- 暗号化バックアップ & 復元 -->
      <div class="pt-2 border-t border-gray-800 space-y-2">
        <label class="block text-xs font-medium text-gray-300">暗号化バックアップ & 復元 (AES-256)</label>
        <div class="space-y-2">
          <input type="password" id="input-backup-pass" placeholder="バックアップ暗号化パスワード" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-xs text-white">
          <div class="flex space-x-2">
            <button id="btn-export-backup" class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 py-2 rounded-lg text-xs">暗号化保存 (.enc)</button>
            <label class="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-gray-200 py-2 rounded-lg text-xs text-center cursor-pointer">
              復元読込
              <input type="file" id="input-restore-file" accept=".enc" class="hidden">
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- 録音コントロール -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex flex-col items-center space-y-3 shrink-0">
      <div class="w-full bg-gray-950 rounded-xl h-14 flex items-center justify-center px-4 overflow-hidden border border-gray-800">
        <canvas id="waveform-canvas" class="w-full h-10"></canvas>
      </div>
      <div class="flex items-center space-x-4">
        <button id="btn-main-record" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 active:scale-95 flex items-center justify-center shadow-lg transition-transform">
          <div id="rec-btn-icon" class="w-6 h-6 rounded-sm bg-white"></div>
        </button>
      </div>
      <div id="record-status-label" class="text-xs text-gray-400 font-mono text-center">待機中 (電卓で「%」を素早く2回タップでも起動)</div>
    </div>

    <!-- 録音・要約リスト一覧ヘッダー＆一括実行ボタン -->
    <div class="space-y-3 flex-1">
      <div class="flex justify-between items-center text-xs text-gray-400 px-1">
        <div class="flex items-center space-x-2">
          <span>録音・要約一覧</span>
          <span id="recordings-count" class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded-full text-[10px]">0 件</span>
        </div>
        <button id="btn-process-all-pending" class="hidden bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-[11px] font-medium flex items-center space-x-1 shadow transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>未処理を一括文字起こし・要約</span>
        </button>
      </div>
      <div id="recordings-list" class="space-y-3 pb-6"></div>
    </div>

  </div>


  <!-- ========================================== -->
  <!-- 3. JavaScript ロジック -->
  <!-- ========================================== -->
  <script>
    let db = null;
    let audioStream = null;
    let audioContext = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let recStartTime = 0;
    let percentTapTimer = null;
    let analyserNode = null;
    let animFrameId = null;

    // スリープ防止（Wake Lock + 無音オーディオ + 疑似動画Canvasストリーム）用変数
    let wakeLockSentinel = null;
    let keepAliveOscillator = null;
    let keepAliveVideoEl = null;
    let keepAliveCanvasTimer = null;
    let autoBlackoutTimer = null;

    // 疑似電源オフ（完全黒画面）ダブルタップ判定用
    let displayAreaTapTimer = null;
    let blackoutTapTimer = null;

    // 現在処理中の録音IDを管理（二重実行防止）
    const activeProcessingIds = new Set();
    let isQueueRunning = false;

    let calcState = {
      display: '0',
      subDisplay: '',
      history: []
    };

    // ====================================================
    // 10分自動ロック＆静的画面スリープを完全に防ぐ3重ガード
    // ====================================================
    async function enableKeepAwakeGuard() {
      // 1. Screen Wake Lock API の取得
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              wakeLockSentinel = null;
              if (isRecording && document.visibilityState === 'visible') {
                navigator.wakeLock.request('screen').then(s => { wakeLockSentinel = s; }).catch(() => {});
              }
            });
          }
        } catch (err) {
          console.warn('WakeLock request warning:', err);
        }
      }

      // 2. 画面が「静的なコンテンツ（静止画）」と判定されて10分で減光・ロックされるのを防ぐため、
      //    電卓画面全体に0.6pxの微細シフトアニメーションを適用 + 不可視の疑似動画ストリームを再生維持する
      const calcView = document.getElementById('calculator-view');
      if (calcView) calcView.classList.add('anti-static-active');

      const badge = document.getElementById('wakelock-status-badge');
      if (badge) badge.classList.remove('hidden');

      // 3. 1×1のCanvas動画ストリームをループ再生してOSに「動画再生中」と認識させる
      try {
        if (!keepAliveVideoEl) {
          const cvs = document.createElement('canvas');
          cvs.width = 2;
          cvs.height = 2;
          const ctx = cvs.getContext('2d');
          let toggle = false;
          keepAliveCanvasTimer = setInterval(() => {
            if (!isRecording) return;
            toggle = !toggle;
            ctx.fillStyle = toggle ? '#000000' : '#010101';
            ctx.fillRect(0, 0, 2, 2);
          }, 1000);

          if (cvs.captureStream) {
            const vStream = cvs.captureStream(1);
            keepAliveVideoEl = document.createElement('video');
            keepAliveVideoEl.muted = true;
            keepAliveVideoEl.loop = true;
            keepAliveVideoEl.playsInline = true;
            keepAliveVideoEl.setAttribute('playsinline', '');
            keepAliveVideoEl.style.position = 'fixed';
            keepAliveVideoEl.style.bottom = '0';
            keepAliveVideoEl.style.right = '0';
            keepAliveVideoEl.style.width = '1px';
            keepAliveVideoEl.style.height = '1px';
            keepAliveVideoEl.style.opacity = '0.001';
            keepAliveVideoEl.style.pointerEvents = 'none';
            keepAliveVideoEl.srcObject = vStream;
            document.body.appendChild(keepAliveVideoEl);
            await keepAliveVideoEl.play().catch(() => {});
          }
        }
      } catch (e) {
        console.warn('Video keep-alive fallback skipped:', e);
      }
    }

    async function disableKeepAwakeGuard() {
      if (wakeLockSentinel) {

      if (keepAliveCanvasTimer) {

      }
      if (keepAliveVideoEl) {
        try {
          keepAliveVideoEl.pause();

    // ====================================================
    // 文字列クリーンアップ＆「はい。はい。」等のループ除去・JSON殻剥がし
    // ====================================================
    function cleanHallucinationLoops(text) {
      if (!text) return '';
      let cleaned = String(text);

      // 1. 同一の短いフレーズ（1〜12文字＋句読点やスペース）が4回以上連続してループしている場合、2回分に圧縮
      cleaned = cleaned.replace(/((?:[^。、！？\n\r]{1,12}[。、！？\s・]+))\1{3,}/g, '$1$1（…相槌・重複省略…）');

      // 2. 句読点なしで同一の2〜8文字が6回以上連続している場合も圧縮
      cleaned = cleaned.replace(/([^\s]{2,8})\1{5,}/g, '$1$1（…重複省略…）');

      return cleaned.trim();
    }

    // 途切れたJSONや区切りタグ付きテキストから安全に summary と transcription を抽出する
    function extractSummaryAndTranscription(rawText) {
      if (!rawText) return { summary: '', transcription: '' };
      const text = String(rawText).trim();

      // パターンA: 新方式の ===SUMMARY=== / ===TRANSCRIPTION=== タグ形式
      if (text.includes('===SUMMARY===') || text.includes('===TRANSCRIPTION===')) {
        let sumPart = '';
        let transPart = '';
        const parts = text.split('===TRANSCRIPTION===');
        sumPart = parts[0].replace('===SUMMARY===', '').trim();
        transPart = (parts[1] || '').trim();
        return {
          summary: cleanHallucinationLoops(sumPart),
          transcription: cleanHallucinationLoops(transPart)
        };
      }

      // パターンB: 完全なJSONとしてパースできる場合
      const strippedCode = text.replace(/```json/gi, '').replace(/```/g, '').trim();
      try {
        const parsed = JSON.parse(strippedCode);
        if (parsed && (parsed.summary || parsed.transcription)) {
          return {
            summary: cleanHallucinationLoops(parsed.summary || ''),
            transcription: cleanHallucinationLoops(parsed.transcription || '')
          };
        }
      } catch (e) {
        // JSONが途中で切れている場合は下の正規表現抽出へ進む
      }

      // パターンC: 途中で切れた不完全なJSON (`{ "summary": "...", "transcription": "...`) から正規表現で救出
      const sumMatch = strippedCode.match(/"summary"\s*:\s*"((?:[^"\\]|\\.)*)/i);
      const transMatch = strippedCode.match(/"transcription"\s*:\s*"((?:[^"\\]|\\.)*)/i);

      if (sumMatch || transMatch) {
        const unescapeJsonStr = (s) => {
          if (!s) return '';
          return s
            .replace(/",\s*"transcri.*$/is, '')
            .replace(/"\s*\}\s*$/s, '')
            .replace(/\\n/g, '\n')
            .replace(/\\"/g, '"')
            .replace(/\\\\/g, '\\')
            .trim();
        };
        return {
          summary: cleanHallucinationLoops(unescapeJsonStr(sumMatch ? sumMatch[1] : '')),
          transcription: cleanHallucinationLoops(unescapeJsonStr(transMatch ? transMatch[1] : ''))
        };
      }

      // パターンD: プレーンテキストの場合
      const cleanedPlain = cleanHallucinationLoops(strippedCode);
      return {
        summary: cleanedPlain.slice(0, 350),
        transcription: cleanedPlain
      };
    }

    // 既存レコードが過去のバグで `{ "summary": ...` の生JSON文字列や「はい。はい。」ループを含んでいたら自動修復する
    function repairRecordIfNeeded(item) {
      if (!item || item.status !== 'completed') return false;
      let modified = false;

      const rawSum = String(item.summary || '');
      const rawTrans = String(item.transcription || '');

      if (rawSum.trim().startsWith('{') || rawTrans.trim().startsWith('{') || rawSum.includes('"summary"')) {
        const sourceText = rawTrans.length >= rawSum.length ? rawTrans : rawSum;
        const extracted = extractSummaryAndTranscription(sourceText);
        if (extracted.summary) {
          item.summary = extracted.summary;
          modified = true;
        }
        if (extracted.transcription) {
          item.transcription = extracted.transcription;
          modified = true;
        }
      } else {
        const cleanedSum = cleanHallucinationLoops(rawSum);
        const cleanedTrans = cleanHallucinationLoops(rawTrans);
        if (cleanedSum !== rawSum) {
          item.summary = cleanedSum;
          modified = true;
        }
        if (cleanedTrans !== rawTrans) {
          item.transcription = cleanedTrans;
          modified = true;
        }
      }

      return modified;
    }

    // トースト通知 (ステルス性を守るため、管理画面が開いている時のみ表示し、電卓画面や黒画面では一切表示しない)

      const recView = document.getElementById('recorder-view');

        ? 'bg-emerald-950/95 border-emerald-700 text-emerald-200'
        : 'bg-gray-900/95 border-gray-700 text-gray-100';

      toast.className = `${colorClass} border px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium transition-all duration-300 pointer-events-auto flex items-center justify-between`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;

    // 数値を3桁カンマ区切りにフォーマット
    function formatCalculationExpression(expr) {
      if (!expr) return '0';
      return expr.replace(/(\d+)(\.\d*)?/g, (match, integerPart, decimalPart) => {
        const formattedInt = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return formattedInt + (decimalPart || '');
      });
    }

    // 電卓表示更新
    function updateCalcDisplay() {
      document.getElementById('calc-main-display').textContent = formatCalculationExpression(calcState.display);
      document.getElementById('calc-sub-display').textContent = formatCalculationExpression(calcState.subDisplay);
    }

    function calcInput(char) {
      if (calcState.display === '0' && char !== '.') {
        calcState.display = char;
      } else {
        calcState.display += char;
      }
      updateCalcDisplay();
    }

    function calcAction(action) {
      if (action === 'clear') {
        calcState.display = '0';
        calcState.subDisplay = '';
      } else if (action === 'backspace') {
        if (calcState.display.length > 1) {
          calcState.display = calcState.display.slice(0, -1);
        } else {
          calcState.display = '0';
        }
      } else if (action === 'paren') {
        const openCount = (calcState.display.match(/\(/g) || []).length;
        const closeCount = (calcState.display.match(/\)/g) || []).length;
        if (openCount > closeCount) {
          calcInput(')');
        } else {
          calcInput('(');
        }
      } else if (action === 'equals') {
        try {
          const expr = calcState.display.replace(/×/g, '*').replace(/÷/g, '/');
          const res = Function(`'use strict'; return (${expr})`)();
          calcState.history.unshift(`${formatCalculationExpression(calcState.display)} = ${formatCalculationExpression(String(res))}`);
          if (calcState.history.length > 20) calcState.history.pop();
          calcState.subDisplay = `${calcState.display} =`;
          calcState.display = String(res);
          renderCalcHistory();
        } catch (e) {
          calcState.subDisplay = 'Error';
        }
      }
      updateCalcDisplay();
    }

          percentTapTimer = null;

      }
    }

    // 録音 & 音声処理
    async function toggleStealthRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      try {
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(audioStream);
        analyserNode = audioContext.createAnalyser();
        analyserNode.fftSize = 64;
        source.connect(analyserNode);

        // オーディオセッションがOSにサスペンドされないよう極小無音オシレーターを接続
        try {
          const silentGain = audioContext.createGain();
          silentGain.gain.value = 0.00001;
          keepAliveOscillator = audioContext.createOscillator();
          keepAliveOscillator.frequency.value = 1;
          keepAliveOscillator.connect(silentGain);
          silentGain.connect(audioContext.destination);
          keepAliveOscillator.start();
        } catch (oscErr) {}

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(audioStream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = handleRecordingComplete;

        mediaRecorder.start(1000);
        isRecording = true;
        recStartTime = Date.now();

        // 10分自動スリープ＆静的コンテンツ減光を阻止するガードを起動
        await enableKeepAwakeGuard();

        document.getElementById('stealth-rec-indicator').classList.add('active');
        document.getElementById('rec-btn-icon').className = "w-6 h-6 rounded-full bg-red-600 animate-pulse";
        document.getElementById('record-status-label').textContent = "● 録音中...";
        drawWaveform();

        // 電卓画面で録音開始した場合、設定がONなら3秒後に自動で真っ黒画面（疑似電源オフ）へ移行
        const calcView = document.getElementById('calculator-view');
        const autoBlackout = localStorage.getItem('auto_blackout_enabled') !== 'false';
        if (autoBlackout && calcView && !calcView.classList.contains('hidden')) {
          if (autoBlackoutTimer) clearTimeout(autoBlackoutTimer);
          autoBlackoutTimer = setTimeout(() => {
            if (isRecording && !calcView.classList.contains('hidden')) {
              setBlackoutMode(true);
            }
          }, 3000);
        }
      } catch (err) {
        showToast("マイクの利用許可が必要です: " + err.message, 'error');
      }
    }

    function stopRecording() {
      if (autoBlackoutTimer) {
        clearTimeout(autoBlackoutTimer);
        autoBlackoutTimer = null;
      }
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      if (audioStream) {
        audioStream.getTracks().forEach(t => t.stop());
      }
      if (keepAliveOscillator) {
        try { keepAliveOscillator.stop(); } catch (e) {}
        keepAliveOscillator = null;
      }
      if (animFrameId) cancelAnimationFrame(animFrameId);
      isRecording = false;

      setBlackoutMode(false);
      disableKeepAwakeGuard();

    function drawWaveform() {
      if (!isRecording || !analyserNode) return;
      const canvas = document.getElementById('waveform-canvas');
      const ctx = canvas.getContext('2d');
      const data = new Uint8Array(analyserNode.frequencyBinCount);
      analyserNode.getByteFrequencyData(data);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#10b981';
      const barWidth = (canvas.width / data.length) * 1.5;
      let x = 0;
      for (let i = 0; i < data.length; i++) {
        const barHeight = (data[i] / 255) * canvas.height;
        ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
        x += barWidth;
      }
      animFrameId = requestAnimationFrame(drawWaveform);
    }

    // 録音完了時処理
    async function handleRecordingComplete() {
      const rawBlob = new Blob(recordedChunks, { type: 'audio/webm' });
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const timestampStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      const title = `録音_${timestampStr}`;
      const elapsedSec = recStartTime > 0 ? Math.max(1, Math.round((Date.now() - recStartTime) / 1000)) : 0;

      const recordItem = {
        title: title,
        date: `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`,
        audioBlob: rawBlob,
        mimeType: 'audio/webm',
        sizeKb: Math.max(1, Math.round(rawBlob.size / 1024)),
        durationSec: elapsedSec,
        summary: null,
        transcription: null,
        status: 'pending'
      };

      let id = null;
      try {
        id = await saveRecordToDB(recordItem);
        recordItem.id = id;
        renderRecordCard(recordItem, true);
        await refreshPendingButtonVisibility();
      } catch (dbErr) {
        console.error("IndexedDB Save Failed:", dbErr);
      }

      // 20分未満かつ15MB未満の録音であれば、末尾の無音カットとMP3軽量化を実行
      const MAX_MP3_CONVERT_BYTES = 15 * 1024 * 1024;
      if (rawBlob.size < MAX_MP3_CONVERT_BYTES && elapsedSec < 1200) {
        try {
          const arrayBuffer = await rawBlob.arrayBuffer();
          const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
          const decodedBuffer = await tempCtx.decodeAudioData(arrayBuffer);

          const targetBuffer = trimSilence(decodedBuffer, 0.008);
          recordItem.durationSec = Math.max(1, Math.round(targetBuffer.duration));

          const mp3Blob = encodeToMp3(targetBuffer, 64);
          recordItem.audioBlob = mp3Blob;
          recordItem.mimeType = 'audio/mp3';
          recordItem.sizeKb = Math.max(1, Math.round(mp3Blob.size / 1024));

          if (tempCtx.close) tempCtx.close().catch(() => {});
          if (id) await updateRecordInDB(recordItem);
          applyAudioUpdateToCard(recordItem);
        } catch (audioErr) {
          console.warn("MP3 conversion skipped, keeping original WebM audio:", audioErr);
        }
      }

      document.getElementById('record-status-label').textContent = "待機中 (電卓で「%」を素早いダブルタップ)";
      
      if (!navigator.onLine) {
        updateCardSummaryStatus(recordItem.id, "オフラインのため待機中です（Wi-Fi接続時に自動実行、または下のボタンから手動実行できます）", false, recordItem);
        return;
      }

      requestGeminiSummary(recordItem);
    }

    function trimSilence(buffer, threshold = 0.008) {
      const channelData = buffer.getChannelData(0);
      const sampleRate = buffer.sampleRate;
      let start = 0;
      let end = channelData.length - 1;

      while (start < channelData.length && Math.abs(channelData[start]) < threshold) start++;
      while (end > start && Math.abs(channelData[end]) < threshold) end--;

      start = Math.max(0, start - Math.floor(sampleRate * 0.5));
      end = Math.min(channelData.length - 1, end + Math.floor(sampleRate * 1.5));

      if (start >= end) return buffer;

      const trimmedLength = Math.max(1, end - start);
      const newCtx = new (window.AudioContext || window.webkitAudioContext)();
      const newBuffer = newCtx.createBuffer(buffer.numberOfChannels, trimmedLength, buffer.sampleRate);

      for (let c = 0; c < buffer.numberOfChannels; c++) {
        newBuffer.copyToChannel(buffer.getChannelData(c).subarray(start, end), c);
      }
      if (newCtx.close) newCtx.close().catch(() => {});
      return newBuffer;
    }

    // 途中でスリープに入ってしまい後半が長い無音になった録音データを検出し、無音部分を切り落として修復する関数
    async function trimTrailingSilenceAndRepair(id) {
      if (!db || activeProcessingIds.has(id)) return;
      const item = await getRecordById(id);
      if (!item || !item.audioBlob) {
        showToast("対象の音声データが見つかりません。", "error");
        return;
      }

      const ok = await showConfirmModal(
        "音声データを解析し、スリープ等で無音になってしまった後半部分を自動で切り落として修復しますか？（50MB超のデータの場合、10〜20秒ほどかかります）",
        "無音カット修復の実行"
      );
      if (!ok) return;

      updateCardSummaryStatus(id, "音声波形を解析して無音区間をトリミング中...（そのままお待ちください）", false, item, true);

      try {
        const arrayBuffer = await item.audioBlob.arrayBuffer();
        const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decodedBuffer = await tempCtx.decodeAudioData(arrayBuffer);

        const channelData = decodedBuffer.getChannelData(0);
        const sampleRate = decodedBuffer.sampleRate;
        const origSec = Math.round(decodedBuffer.duration);

        const threshold = 0.008;
        let lastActiveSample = channelData.length - 1;
        while (lastActiveSample > 0 && Math.abs(channelData[lastActiveSample]) < threshold) {
          lastActiveSample--;
        }

        const marginSamples = Math.min(channelData.length, lastActiveSample + sampleRate * 2);
        const newDurationSec = Math.max(1, Math.round(marginSamples / sampleRate));

        if (origSec - newDurationSec < 5) {
          showToast("末尾に5秒以上の長い無音区間は見つかりませんでした。", "info");
          applySummaryToCard(item);
          return;
        }

        const trimmedBuffer = tempCtx.createBuffer(1, marginSamples, sampleRate);
        trimmedBuffer.copyToChannel(channelData.subarray(0, marginSamples), 0);

        const mp3Blob = encodeToMp3(trimmedBuffer, 64);
        item.audioBlob = mp3Blob;
        item.mimeType = 'audio/mp3';
        item.sizeKb = Math.max(1, Math.round(mp3Blob.size / 1024));
        item.durationSec = newDurationSec;

        await updateRecordInDB(item);
        applyAudioUpdateToCard(item);
        applySummaryToCard(item);

        showToast(`無音区間をカットしました！（${formatDurationLabel(origSec)} → ${formatDurationLabel(newDurationSec)} / ${item.sizeKb.toLocaleString()} KB）`, "success");
      } catch (err) {
        console.error("Trim Silence Error:", err);
        showToast("無音カット処理中にエラーが発生しました: " + err.message, "error");
        applySummaryToCard(item);
      }
    }

    function encodeToMp3(audioBuffer, kbps = 96) {
      const channels = 1;
      const sampleRate = audioBuffer.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
      const samples = audioBuffer.getChannelData(0);
      const sampleBlockSize = 1152;
      const mp3Data = [];

      const int16Samples = new Int16Array(samples.length);
      for (let i = 0; i < samples.length; i++) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
        const chunk = int16Samples.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(chunk);
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }
      const endBuf = mp3encoder.flush();
      if (endBuf.length > 0) mp3Data.push(endBuf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }

    // 1時間などの大容量音声ファイル向け: Gemini File API へのアップロード処理
    async function uploadAudioViaFileApi(blob, mimeType, apiKey, displayName) {
      const initUrl = `https://generativelanguage.googleapis.com/upload/v1beta/files?key=${apiKey}`;
      const initRes = await fetch(initUrl, {
        method: 'POST',
        headers: {
          'X-Goog-Upload-Protocol': 'resumable',
          'X-Goog-Upload-Command': 'start',
          'X-Goog-Upload-Header-Content-Length': String(blob.size),
          'X-Goog-Upload-Header-Content-Type': mimeType,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ file: { display_name: displayName } })
      });

      if (!initRes.ok) {
        throw new Error(`ファイルアップロード初期化失敗 (HTTP ${initRes.status})`);
      }

      const uploadUrl = initRes.headers.get('x-goog-upload-url');
      if (!uploadUrl) {
        throw new Error('アップロードURLが取得できませんでした。');
      }

      const uploadRes = await fetch(uploadUrl, {
        method: 'POST',
        headers: {
          'Content-Length': String(blob.size),
          'X-Goog-Upload-Offset': '0',
          'X-Goog-Upload-Command': 'upload, finalize'
        },
        body: blob
      });

      if (!uploadRes.ok) {
        throw new Error(`音声データのアップロードに失敗しました (HTTP ${uploadRes.status})`);
      }

      const fileData = await uploadRes.json();
      const fileUri = fileData.file.uri;
      const fileName = fileData.file.name;

      let state = fileData.file.state;
      let attempts = 0;
      while (state === 'PROCESSING' && attempts < 60) {
        await new Promise(r => setTimeout(r, 3000));
        const checkRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}?key=${apiKey}`);
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          state = checkData.state;
          if (state === 'FAILED') throw new Error('Gemini側での音声ファイル処理に失敗しました。');
        }
        attempts++;
      }

      return { fileUri, fileName };
    }

    // 未処理データのキューを一括・順次処理（Wi-Fi復帰時および一括ボタン用）
    async function processPendingQueue(silentIfNoKey = false) {
      if (isQueueRunning || !db) return;
      if (!navigator.onLine) {
        if (!silentIfNoKey) showToast("現在オフラインです。Wi-Fiまたはモバイル通信に接続してください。", "error");
        return;
      }

      const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
      if (!apiKey) {
        if (!silentIfNoKey) {
          showToast("Gemini APIキーが未設定です。右上の設定ボタンから登録してください。", "error");
          document.getElementById('settings-panel').classList.remove('hidden');
        }
        return;
      }

      const allRecords = await getAllRecordsFromDB();
      const pendingList = allRecords.filter(r => r.status !== 'completed' && !activeProcessingIds.has(r.id));

      if (pendingList.length === 0) {
        if (!silentIfNoKey) showToast("未処理の録音データはありません。", "info");
        return;
      }

      isQueueRunning = true;
      try {
        for (const item of pendingList) {
          if (!navigator.onLine) break;
          await requestGeminiSummary(item);
        }
      } finally {
        isQueueRunning = false;
        await refreshPendingButtonVisibility();
      }
    }

    document.getElementById('btn-process-all-pending').addEventListener('click', () => {
      processPendingQueue(false);
    });

    // Gemini API 要約 & 文字起こし本体
    async function requestGeminiSummary(item) {
      if (!item || !item.id) return;
      if (activeProcessingIds.has(item.id)) return;

      const apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
      let model = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';

      if (!apiKey) {
        updateCardSummaryStatus(item.id, "APIキーが未登録です。右上の設定画面からGemini APIキーを入力後、下のボタンで実行してください。", true, item);
        return;
      }

      if (!navigator.onLine) {
        updateCardSummaryStatus(item.id, "インターネット未接続です。Wi-Fi接続時に自動実行されるか、下のボタンで手動実行できます。", true, item);
        return;
      }

      activeProcessingIds.add(item.id);
      const mimeType = item.mimeType || 'audio/webm';
      const isLargeFile = item.audioBlob.size > 12 * 1024 * 1024;

      const promptText = `あなたは優秀なプロの議事録作成・文字起こしアシスタントです。
提供された音声を分析し、以下のフォーマット（区切り文字 ===SUMMARY=== と ===TRANSCRIPTION===）を使って出力してください。JSONやコードブロックは絶対に使わないでください。

【重要ルール】
1. 無音区間やノイズ、または「はい。はい。はい。」「うん、うん」といった意味のない相槌の連続は絶対に繰り返して出力しないでください（ループ厳禁）。
2. 実質的な会話・議論の内容を忠実かつ読みやすい自然な日本語で文字起こししてください。

===SUMMARY===
（ここに録音内容の全体要約・主要な決定事項・論点を整理して記述）
===TRANSCRIPTION===
（ここに音声の文字起こし全文を記述）`;

      let uploadedFileName = null;

      try {
        let audioPart = null;

        if (isLargeFile) {
          updateCardSummaryStatus(item.id, `長時間音声 (${Math.round(item.audioBlob.size / 1024 / 1024 * 10) / 10}MB) をGeminiへアップロード中...`, false, item, true);
          const uploadResult = await uploadAudioViaFileApi(item.audioBlob, mimeType, apiKey, item.title);
          uploadedFileName = uploadResult.fileName;
          audioPart = {
            file_data: {
              mime_type: mimeType,
              file_uri: uploadResult.fileUri
            }
          };
          updateCardSummaryStatus(item.id, `アップロード完了。Gemini (${model}) で文字起こし・要約を生成中...（長時間音声のため1〜2分ほどかかります）`, false, item, true);
        } else {
          updateCardSummaryStatus(item.id, `Gemini (${model}) へ音声送信・要約を生成中...`, false, item, true);
          const base64Audio = await blobToBase64(item.audioBlob);
          if (!base64Audio) throw new Error("音声データの変換に失敗しました。");
          audioPart = {
            inline_data: {
              mime_type: mimeType,
              data: base64Audio
            }
          };
        }

        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: promptText },
              audioPart
            ]
          }],
          generationConfig: {
            temperature: 0.2,
            maxOutputTokens: 65536
          }
        };

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errDetail = "";
          try {
            const errJson = await response.json();
            errDetail = errJson.error?.message || JSON.stringify(errJson);
          } catch(e) {
            errDetail = await response.text();
          }
          throw new Error(`HTTP ${response.status}: ${errDetail}`);
        }

        const data = await response.json();
        const candidate = data.candidates?.[0];
        if (!candidate || !candidate.content) {
          throw new Error("Geminiから有効な応答が得られませんでした。");
        }

        const rawText = candidate.content.parts?.[0]?.text || '';
        const extracted = extractSummaryAndTranscription(rawText);

        item.summary = extracted.summary || "要約が取得できませんでした";
        item.transcription = extracted.transcription || "文字起こしが取得できませんでした";
        item.status = 'completed';
        await updateRecordInDB(item);

        applySummaryToCard(item);
        showToast(`「${item.title}」の文字起こし・要約が完了しました！`, 'success');
      } catch (err) {
        console.error("Gemini API Error:", err);
        updateCardSummaryStatus(item.id, `エラー: ${err.message}`, true, item, false);
      } finally {
        activeProcessingIds.delete(item.id);
        await refreshPendingButtonVisibility();
        if (uploadedFileName) {
          fetch(`https://generativelanguage.googleapis.com/v1beta/${uploadedFileName}?key=${apiKey}`, { method: 'DELETE' }).catch(() => {});
        }
      }
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          if (typeof reader.result === 'string') {
            const base64 = reader.result.split(',')[1];
            resolve(base64 || '');
          } else {
            reject(new Error("FileReader result is not string"));
          }
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // IndexedDB 操作
    function saveRecordToDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.add(item);
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    function updateRecordInDB(item) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.put(item);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function getRecordById(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readonly');
        const store = tx.objectStore('recordings');
        const req = store.get(Number(id));
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e);
      });
    }

    function getAllRecordsFromDB() {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readonly');
        const store = tx.objectStore('recordings');
        const req = store.getAll();
        req.onsuccess = (e) => resolve(e.target.result || []);
        req.onerror = (e) => reject(e);
      });
    }

    function deleteRecordFromDB(id) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('recordings', 'readwrite');
        const store = tx.objectStore('recordings');
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function formatDurationLabel(sec) {

        const h = Math.floor(m / 60);
        const rm = m % 60;
        return `${h}時間${rm}分${s}秒`;
      }
      return m > 0 ? `${m}分${s}秒` : `${s}秒`;
    }

            <a id="audio-download-${item.id}" href="${audioUrl}" download="${item.title}.${ext}" class="text-indigo-400 hover:underline flex items-center space-x-1">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>${ext.toUpperCase()}保存</span>
            </a>
          </div>
        </div>

        <div id="summary-section-${item.id}" class="pt-2 border-t border-gray-800 space-y-2">
          ${renderSummaryContent(item)}
        </div>
      `;

      if (prepend && container.firstChild) {
        container.insertBefore(card, container.firstChild);
      } else {
        container.appendChild(card);
      }
    }

    function applyAudioUpdateToCard(item) {
      const audioUrl = URL.createObjectURL(item.audioBlob);
      const player = document.getElementById(`audio-player-${item.id}`);
      const meta = document.getElementById(`audio-meta-${item.id}`);
      const download = document.getElementById(`audio-download-${item.id}`);
      if (player) player.src = audioUrl;
      if (meta) meta.textContent = `${item.sizeKb.toLocaleString()} KB · ${formatDurationLabel(item.durationSec)}`;
      if (download) {
        download.href = audioUrl;
        download.download = `${item.title}.mp3`;
        download.innerHTML = `
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>MP3保存</span>
        `;
      }
    }

    function renderSummaryContent(item) {
      if (item.status === 'completed' && item.summary) {
        return `
          <div class="bg-gray-950 p-2.5 rounded-lg space-y-1">
            <div class="flex justify-between items-center">
              <span class="text-indigo-400 font-semibold text-[11px]">【全体要約】</span>
              <button type="button" onclick="manualTriggerSummary(${item.id})" class="text-gray-500 hover:text-gray-300 text-[10px] underline" title="もう一度要約を実行">再生成</button>
            </div>
            <p class="text-gray-200 text-xs leading-relaxed whitespace-pre-wrap">${escapeHtml(item.summary)}</p>
          </div>
          <details class="bg-gray-950 rounded-lg p-2.5">
            <summary class="flex justify-between items-center cursor-pointer text-gray-400 text-[11px]">
              <span>文字起こし全文を表示</span>
              <button type="button" onclick="copyFullTranscription(event, ${item.id})" class="text-indigo-400 hover:text-indigo-300 text-[10px] px-2 py-0.5 rounded bg-gray-800 border border-gray-700">全文コピー</button>
            </summary>
            <p id="transcription-text-${item.id}" class="mt-2 text-gray-300 text-xs leading-relaxed whitespace-pre-wrap">${escapeHtml(item.transcription)}</p>
          </details>
        `;
      } else {
        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-gray-950/80 border border-gray-800/80 rounded-lg p-2.5">
            <div class="flex items-center space-x-2 text-amber-400/90 text-xs">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <span>処理待ちまたは要約未完了</span>
            </div>
            <button type="button" onclick="manualTriggerSummary(${item.id})" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center justify-center space-x-1.5 shadow transition shrink-0">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
              <span>文字起こし・要約を実行</span>
            </button>
          </div>
        `;
      }
    }

    function updateCardSummaryStatus(id, text, isError, item = null, isProcessing = false) {
      const section = document.getElementById(`summary-section-${id}`);
      if (!section) return;
      section.innerHTML = `
        <div class="flex flex-col space-y-2 bg-gray-950/90 border ${isError ? 'border-red-900/60' : 'border-gray-800'} rounded-lg p-2.5">
          <div class="flex items-center space-x-2 text-xs ${isError ? 'text-red-400 font-medium' : 'text-indigo-300'}">
            ${isProcessing ? `<svg class="w-4 h-4 animate-spin shrink-0 text-indigo-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>` : ''}
            <span class="break-all leading-relaxed">${escapeHtml(text)}</span>
          </div>
          ${!isProcessing ? `
            <div class="flex justify-end">
              <button type="button" onclick="manualTriggerSummary(${id})" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1 shadow transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                <span>文字起こし・要約を実行</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function applySummaryToCard(item) {
      const section = document.getElementById(`summary-section-${item.id}`);
      if (section) section.innerHTML = renderSummaryContent(item);
      const card = document.getElementById(`record-card-${item.id}`);
      if (card) {
        const dot = card.querySelector('span.rounded-full');
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      }
    }

    async function handleDeleteRecord(id) {
      const ok = await showConfirmModal("この録音データを削除しますか？", "削除の確認");
      if (ok) {
        await deleteRecordFromDB(id);
        const card = document.getElementById(`record-card-${id}`);
        if (card) card.remove();
        loadSavedRecordings();
        showToast("録音データを削除しました。", "info");
      }
    }

    function copyFullTranscription(e, id) {
      e.stopPropagation();
      const el = document.getElementById(`transcription-text-${id}`);
      if (!el) return;
      const text = el.innerText || el.textContent;
      navigator.clipboard.writeText(text).then(() => {
        showToast("文字起こし全文をコピーしました！", "success");
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast("文字起こし全文をコピーしました！", "success");
      });
    }

    // 設定パネル制御
    document.getElementById('btn-open-settings').addEventListener('click', () => {
      document.getElementById('settings-panel').classList.remove('hidden');
      document.getElementById('input-api-key').value = localStorage.getItem('gemini_api_key') || '';
      document.getElementById('select-model').value = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';
      document.getElementById('toggle-auto-sync').checked = localStorage.getItem('auto_sync_enabled') !== 'false';
      document.getElementById('toggle-auto-blackout').checked = localStorage.getItem('auto_blackout_enabled') !== 'false';
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-panel').classList.add('hidden');
    });

    document.getElementById('btn-save-api-key').addEventListener('click', () => {
      const key = document.getElementById('input-api-key').value.trim();
      const model = document.getElementById('select-model').value;
      const autoSync = document.getElementById('toggle-auto-sync').checked;
      const autoBlackout = document.getElementById('toggle-auto-blackout').checked;
      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', model);
      localStorage.setItem('auto_sync_enabled', String(autoSync));
      localStorage.setItem('auto_blackout_enabled', String(autoBlackout));
      showToast("設定を保存しました！", "success");
      document.getElementById('settings-panel').classList.add('hidden');

      if (key && autoSync && navigator.onLine) {
        processPendingQueue(true);
      }
    });

    document.getElementById('toggle-auto-sync').addEventListener('change', (e) => {
      localStorage.setItem('auto_sync_enabled', String(e.target.checked));
    });

    document.getElementById('toggle-auto-blackout').addEventListener('change', (e) => {
      localStorage.setItem('auto_blackout_enabled', String(e.target.checked));
    });

    // 暗号化バックアップ & 復元
    document.getElementById('btn-export-backup').addEventListener('click', async () => {
      const password = document.getElementById('input-backup-pass').value;
      if (!password) {
        showToast("暗号化パスワードを入力してください。", "error");
        return;
      }

      const records = await getAllRecordsFromDB();
      const exportList = [];

      for (const item of records) {
        const b64 = await blobToBase64(item.audioBlob);
        exportList.push({
          title: item.title,
          date: item.date,
          sizeKb: item.sizeKb,
          durationSec: item.durationSec,
          summary: item.summary,
          transcription: item.transcription,
          status: item.status,
          audioBase64: b64,
          mimeType: item.mimeType || 'audio/mp3'
        });
      }

      const rawJson = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), records: exportList });
      const encData = await encryptData(rawJson, password);

      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const filename = `MyCalculator_Backup_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}.enc`;

      const blob = new Blob([encData], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      showToast("暗号化バックアップを保存しました。", "success");
    });

    document.getElementById('input-restore-file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const password = document.getElementById('input-backup-pass').value;
      if (!password) {
        showToast("復元用パスワードを入力してください。", "error");
        e.target.value = '';
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const decJson = await decryptData(new Uint8Array(buffer), password);
        const data = JSON.parse(decJson);

        if (!data.records || !Array.isArray(data.records)) throw new Error("形式が正しくありません");

        for (const r of data.records) {
          const byteCharacters = atob(r.audioBase64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
          const byteArray = new Uint8Array(byteNumbers);
          const mime = r.mimeType || 'audio/mp3';
          const audioBlob = new Blob([byteArray], { type: mime });

          await saveRecordToDB({
            title: r.title,
            date: r.date,
            sizeKb: r.sizeKb,
            durationSec: r.durationSec,
            summary: r.summary,
            transcription: r.transcription,
            status: r.status,
            audioBlob: audioBlob,
            mimeType: mime
          });
        }

        showToast("バックアップから復元しました！", "success");
        e.target.value = '';
        loadSavedRecordings();
      } catch (err) {
        showToast("復元に失敗しました。パスワードが誤っているかファイルが破損しています", "error");
      }
    });

    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
    }

    async function deriveKey(keyMaterial, salt) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptData(text, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);
      const enc = new TextEncoder();
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(text));

      const res = new Uint8Array(salt.length + iv.length + cipher.byteLength);
      res.set(salt, 0);
      res.set(iv, salt.length);
      res.set(new Uint8Array(cipher), salt.length + iv.length);
      return res;
    }

    async function decryptData(bytes, password) {
      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const cipher = bytes.slice(28);
      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);
      const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher);
      return new TextDecoder().decode(dec);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 初期化実行
    (async function init() {
      updateNetworkBadge();
      await initDB();
      updateCalcDisplay();
    })();
  </script>
</body>
